<body>

<h1>Atendimento Online</h1>

<form>

Nome completo:<br>
<input type="text"><br><br>

E-mail:<br>
<input type="email"><br><br>

Telefone:<br>
<input type="tel"><br><br>

Tipo de atendimento:<br>
<select>
<option>Dúvida</option>
<option>Reclamação</option>
<option>Sugestão</option>
</select><br><br>

Prioridade:<br>
<input type="radio" name="prioridade"> Baixa<br>
<input type="radio" name="prioridade"> Média<br>
<input type="radio" name="prioridade"> Alta<br><br>

Descrição detalhada:<br>

Anexo de arquivo:<br>
<input type="file"><br><br>

<input type="checkbox">
Autorizar contato<br><br>

<input type="submit" value="Enviar">

</form>
